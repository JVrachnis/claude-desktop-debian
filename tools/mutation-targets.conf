# Targets for tools/mutation-test.py, one per line:
#   name | target script | covering .bats files | functions | bats -f filter
# "functions" (comma-separated) limits mutation to those functions' bodies,
# for large files such as doctor.sh; empty means the whole file. The bats
# filter narrows which tests run per mutant; empty runs the whole files.
# Pick targets whose tests are focused and fast: every mutant runs them.

dep11-hook        | scripts/repo/reprepro-dep11-hook.sh   | tests/appstream-catalog.bats   |  |
appstream-catalog | scripts/repo/appstream-catalog.sh     | tests/appstream-catalog.bats   |  |
tray-icon         | scripts/patches/tray-icon-selection.sh | tests/tray-icon-selection.bats |  |
doctor-checks     | scripts/doctor.sh                     | tests/doctor.bats | _doctor_check_device_key,_doctor_check_disk_space,_doctor_check_singleton_lock,_doctor_check_chrome_sandbox,_doctor_check_pkg_version | _doctor_check_(device_key|disk_space|singleton_lock|chrome_sandbox|pkg_version)
